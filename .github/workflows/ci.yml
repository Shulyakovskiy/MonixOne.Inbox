name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build, test and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify Docker for Testcontainers
        run: |
          docker version
          docker info
          docker pull postgres:18-alpine
          docker pull nats:2.12-alpine

      - name: Restore
        run: dotnet restore MonixOne.Inbox.sln --disable-parallel

      - name: Build
        run: >-
          dotnet build MonixOne.Inbox.sln --configuration Release --no-restore
          --disable-build-servers -m:1 -p:GeneratePackageOnBuild=false

      - name: Test, including PostgreSQL and NATS integration
        # Prevent a successful run with an unexpectedly incomplete test suite.
        run: >-
          dotnet test --project tests/MonixOne.Inbox.Tests/MonixOne.Inbox.Tests.csproj
          --configuration Release --no-build --no-restore --
          --minimum-expected-tests 183 --no-ansi --progress off

      - name: Pack
        run: >-
          dotnet pack src/MonixOne.Inbox/MonixOne.Inbox.csproj
          --configuration Release --no-build --no-restore --output artifacts/nuget
          -p:GeneratePackageOnBuild=false
